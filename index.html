<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AcciEye | Intelligent Detection</title>
<style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background-color: #06111d; /* Deep Navy from image_2040bb.png */
            color: #ffffff;
        }
        .container { 
            text-align: center; 
            background: #0b1a29; /* Slightly lighter navy for depth */
            padding: 40px; 
            border-radius: 12px; 
            border: 1px solid #00f0b5; /* Teal accent border */
            box-shadow: 0 4px 20px rgba(0,0,0,0.5); 
            width: 80%; 
            max-width: 400px; 
        }
        h1 { color: #00f0b5; margin-bottom: 10px; } /* Teal Header */
        p { color: #cfcfcf; margin-bottom: 30px; }
        .btn { 
            display: block; 
            padding: 15px; 
            margin: 15px 0; 
            text-decoration: none; 
            border-radius: 5px; 
            font-weight: bold; 
            transition: all 0.3s; 
        }
        .btn-primary { 
            background-color: #00f0b5; 
            color: #06111d; 
        }
        .btn-primary:hover { background-color: #00c493; }
        .btn-secondary { 
            background-color: transparent; 
            color: #00f0b5; 
            border: 1px solid #00f0b5; 
        }
        .btn-secondary:hover { background-color: rgba(0, 240, 181, 0.1); }
</style>
</head>
<body>
<div class="container">
<h1>AcciEye</h1>
<p>Intelligent AI Traffic Accident Detection System</p>
<a href="https://huggingface.co/spaces/Ounaa2003/AcciEye" class="btn btn-primary">Launch Application</a>
<a href="https://drive.google.com/uc?export=download&id=1N-EJ1vFCA4BAD-_R9GuLEjzEH2-uXNRa" class="btn btn-secondary">Download Sample Data</a>
</div>
</body>
</html>
